name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · lint, types, tests, eval
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: receptionist
          POSTGRES_PASSWORD: receptionist
          POSTGRES_DB: receptionist_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U receptionist" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Tests (unit + integration against Postgres)
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered
      - name: Evaluation (tools mode, must keep 0 invented slots / 0 double bookings)
        run: uv run python -m eval.run --mode tools
        env:
          EVAL_DATABASE_URL: postgresql+psycopg://receptionist:receptionist@localhost:55432/receptionist_eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.*

  web:
    name: Web · lint, types, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint src
      - run: npx next typegen && npx tsc --noEmit
      - run: npx next build
        env:
          API_URL: http://localhost:8010

  e2e:
    name: End-to-end (Playwright on docker compose)
    runs-on: ubuntu-24.04
    needs: [python, web]
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: |
          docker compose up -d --build db api worker web
          for i in $(seq 90); do
            curl -fs localhost:8010/ready >/dev/null && curl -fs localhost:3010 >/dev/null && break
            sleep 2
          done
          curl -fs localhost:8010/ready
          echo "luma-e2e-owner-pass" | docker compose exec -T api python -m app.cli create-admin --email owner@luma.example.com --name "Luma Owner"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:3010
          E2E_API_URL: http://localhost:8010
          AGENT_SERVICE_TOKEN: dev-agent-token
      - if: failure()
        run: docker compose logs api worker web | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  images:
    name: Images · build and scan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: api, context: ., target: runtime, file: Dockerfile }
          - { name: agent, context: ., target: agent, file: Dockerfile }
          - { name: web, context: web, target: runtime, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          tags: ai-voice-receptionist-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image (fail on fixable critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-voice-receptionist-${{ matrix.name }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  bicep:
    name: Azure Bicep · build and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: az bicep install
      - run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - run: az bicep lint --file deploy/azure/main.bicep
      - run: az bicep build-params --file deploy/azure/main.bicepparam --stdout > /dev/null
