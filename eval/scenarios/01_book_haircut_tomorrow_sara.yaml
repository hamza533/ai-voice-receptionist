id: book_haircut_tomorrow_sara
category: booking
goal: Book a haircut with Sara tomorrow afternoon.
persona: Friendly regular customer, knows what she wants.
caller:
  name: Ayesha Khan
  phone: '+923001112233'
  email: ayesha.k@example.com
setup: {}
settings: {}
expected_tools:
- check_availability
- book_appointment
expected:
  appointments_active: 1
  outcome: booked
script:
- tool: check_availability
  args:
    service: Haircut
    date_from: tomorrow
    staff: Sara
    time_of_day: afternoon
  expect: ok
- tool: book_appointment
  args:
    slot_id: $slot[0]
    service: Haircut
    customer_name: Ayesha Khan
    email: ayesha.k@example.com
    caller_confirmed: false
  expect: needs_confirmation
- tool: book_appointment
  args:
    slot_id: $slot[0]
    service: Haircut
    customer_name: Ayesha Khan
    email: ayesha.k@example.com
    caller_confirmed: true
  expect: ok
