id: book_colour_first_available
category: booking
goal: Book a hair colour at the first available time.
persona: Flexible about the day, wants it soon.
caller:
  name: Ayesha Khan
  phone: '+923001112233'
  email: ayesha.k@example.com
setup: {}
settings: {}
expected_tools:
- check_availability
- book_appointment
expected:
  appointments_active: 1
  outcome: booked
  duration_min: 120
script:
- tool: check_availability
  args:
    service: Hair colour
    date_from: today
    date_to: in 7 days
  expect: ok
- tool: book_appointment
  args:
    slot_id: $slot[0]
    service: Hair colour
    customer_name: Ayesha Khan
    email: ayesha.k@example.com
    caller_confirmed: false
  expect: needs_confirmation
- tool: book_appointment
  args:
    slot_id: $slot[0]
    service: Hair colour
    customer_name: Ayesha Khan
    email: ayesha.k@example.com
    caller_confirmed: true
  expect: ok
