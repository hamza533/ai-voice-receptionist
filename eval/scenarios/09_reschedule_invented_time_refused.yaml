id: reschedule_invented_time_refused
category: reschedule
goal: Wants 9 PM Wednesday, which was never offered.
persona: Insists on a time that isn't available.
caller:
  name: Ayesha Khan
  phone: '+923001112233'
  email: ayesha.k@example.com
setup:
  existing:
  - service: Haircut
    staff: Sara
    date: '2025-11-25'
    time: '15:00'
    name: Ayesha Khan
    phone: '+923001112233'
    email: ayesha.k@example.com
settings: {}
expected_tools:
- check_availability
- reschedule_appointment
expected:
  appointments_active: 1
  appointment_status: rescheduled
script:
- tool: reschedule_appointment
  args:
    contact: '+923001112233'
    date: '2025-11-25'
    new_slot_id: 1:20251126T1600Z
    caller_confirmed: true
  expect: invalid
  invented: true
- tool: check_availability
  args:
    service: Haircut
    date_from: wednesday
    time_of_day: evening
  expect: ok
- tool: reschedule_appointment
  args:
    contact: '+923001112233'
    date: '2025-11-25'
    new_slot_id: $slot[-1]
    caller_confirmed: true
  expect: ok
