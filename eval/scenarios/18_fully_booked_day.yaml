id: fully_booked_day
category: fully_booked
goal: Wants a haircut on Tuesday, which is fully booked.
persona: Accepts the next opening offered.
caller:
  name: Ayesha Khan
  phone: '+923001112233'
  email: ayesha.k@example.com
setup:
  block_day: '2025-11-25'
settings: {}
expected_tools:
- check_availability
- book_appointment
expected:
  appointments_active: 1
  not_on_local_date: '2025-11-25'
script:
- tool: check_availability
  args:
    service: Haircut
    date_from: '2025-11-25'
    date_to: '2025-11-25'
  expect: ok
- tool: book_appointment
  args:
    slot_id: $slot[0]
    service: Haircut
    customer_name: Ayesha Khan
    email: ayesha.k@example.com
    caller_confirmed: false
  expect: needs_confirmation
- tool: book_appointment
  args:
    slot_id: $slot[0]
    service: Haircut
    customer_name: Ayesha Khan
    email: ayesha.k@example.com
    caller_confirmed: true
  expect: ok
