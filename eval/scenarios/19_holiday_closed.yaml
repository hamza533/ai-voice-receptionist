id: holiday_closed
category: fully_booked
goal: Wants a haircut on a public holiday.
persona: Didn't know it's a holiday.
caller:
  name: Ayesha Khan
  phone: '+923001112233'
  email: ayesha.k@example.com
setup:
  holiday: '2025-11-27'
settings: {}
expected_tools:
- check_availability
- book_appointment
expected:
  appointments_active: 1
  not_on_local_date: '2025-11-27'
script:
- tool: check_availability
  args:
    service: Haircut
    date_from: '2025-11-27'
    date_to: '2025-11-27'
  expect: ok
- tool: book_appointment
  args:
    slot_id: $slot[0]
    service: Haircut
    customer_name: Ayesha Khan
    email: ayesha.k@example.com
    caller_confirmed: false
  expect: needs_confirmation
- tool: book_appointment
  args:
    slot_id: $slot[0]
    service: Haircut
    customer_name: Ayesha Khan
    email: ayesha.k@example.com
    caller_confirmed: true
  expect: ok
