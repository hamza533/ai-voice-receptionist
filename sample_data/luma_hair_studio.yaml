faqs:
  - question: Is there parking nearby?
    answer: Yes, free street parking on Market Street and a paid car park two minutes' walk away behind the bank.
    tags: parking car location
  - question: What payment methods do you accept?
    answer: Cash, all major debit and credit cards, and bank transfer. We don't take cheques.
    tags: payment pay card cash
  - question: What is your cancellation policy?
    answer: Please give us at least 12 hours' notice to cancel or move an appointment. You can call any time and the receptionist will do it for you.
    tags: cancel cancellation policy notice late fee
  - question: Do you take walk-ins?
    answer: We take walk-ins when a stylist is free, but booking ahead guarantees your time.
    tags: walk-in walk in without appointment
  - question: Do you cut children's hair?
    answer: Yes, kids haircuts are for children under 12 and take about 30 minutes.
    tags: kids children child son daughter
  - question: Do I need a patch test before colouring?
    answer: For first-time colour clients we do a quick skin patch test at least 48 hours before the colour appointment. It's free and takes five minutes.
    tags: colour color patch test allergy dye
  - question: What happens if I'm running late?
    answer: Let us know as soon as you can. If you're more than 15 minutes late we may need to shorten the service or move you to the next free time.
    tags: late running delay
  - question: Do you sell hair products?
    answer: Yes, we stock shampoos, conditioners and styling products, and your stylist can recommend what suits your hair.
    tags: products shampoo buy sell
  - question: Do you offer gift vouchers?
    answer: Yes, gift vouchers are available in any amount from PKR 2,000 and are valid for 12 months.
    tags: gift voucher present card
  - question: How long does a hair colour take?
    answer: A full colour takes about two hours including toner and blow-dry.
    tags: colour color how long duration time
